<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#07101d"/>
    <stop offset="1" stop-color="#0b1523"/>
  </linearGradient>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#8ea0b8}
    .small{font-size:12px}
    .label{font-size:13px;font-weight:700;fill:#9eb0c6}
    .value{font-size:31px;font-weight:800;fill:#eef5ff}
    .title{font-size:27px;font-weight:800;fill:#f4f8fc}
    .section{font-size:16px;font-weight:800;fill:#e7eef8}
    .th{font-size:12px;font-weight:800;fill:#dce8f7}
    .td{font-size:12px;fill:#c4d0df}
    .chip{font-size:11px;font-weight:800}
  </style>
</defs>

